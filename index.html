<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Pirate Prize Odds — Chest Simulator</title>
<style>
:root{color-scheme:dark;--bg:#111;--panel:#1d1d1d;--line:#303030;--muted:#aaa;--white:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
main{max-width:820px;margin:0 auto}
.panel{overflow:hidden;border-radius:18px;background:var(--panel);border:1px solid #242424;box-shadow:0 10px 30px #0005}
.header{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.heading{font-weight:800;font-size:18px;letter-spacing:.2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#19d66b;margin-right:8px;vertical-align:2px}
.sub{margin-top:7px;color:#b8b8b8;font-size:14px}
.item{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);min-height:68px}
.item:last-child{border-bottom:0}
.item.obtained{opacity:.42}
.item.obtained .name:after{content:"  ✓ OBTAINED";color:#28d76b;font-size:11px}
.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none}
.name{font-size:15px;font-weight:800;flex:1}
.odds{font-size:16px;font-weight:800;white-space:nowrap}
.controls{display:flex;gap:12px;align-items:center;margin:18px 0;flex-wrap:wrap}
button{border:0;border-radius:10px;background:#f5c84b;color:#17120a;font-size:17px;font-weight:900;padding:15px 24px;cursor:pointer;box-shadow:0 4px 0 #9b7622}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #9b7622}
button:disabled{opacity:.65;cursor:wait}
.counter{color:#bbb;font-size:14px}
.result{border:1px solid var(--line);border-radius:14px;background:#1b1b1b;padding:18px;min-height:108px;display:flex;align-items:center;gap:14px}
.result img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.result-title{font-size:19px;font-weight:900}
.result-detail{margin-top:5px;color:#aaa;font-size:13px}
.result.none{justify-content:center;text-align:center;color:#bdbdbd;font-weight:800}
.history{margin-top:18px;color:#bbb;font-size:13px;line-height:1.7}
.history strong{color:white}
@media(max-width:520px){body{padding:12px}.odds{font-size:14px}.name{font-size:13px}.item{gap:9px;padding:9px}.thumb{width:44px;height:44px}.header{padding:16px}}
</style>
</head>

  name.className = 'name';
  name.textContent = prize.name;
  const odds = document.createElement('div');
  odds.className = 'odds';
  odds.textContent = '1 in ' + prize.odds.toLocaleString('en-US');
  row.append(image, name, odds);
  list.appendChild(row);
  rowByPrize.set(prize.name, row);
}

// Sorteio de um único resultado por baú: cada prêmio ocupa uma faixa
// de probabilidade exclusiva; todo o restante corresponde a "Nada".
function openChest() {
  const roll = Math.random();
  let cumulative = 0;
  let won = null;

  // Prêmios já obtidos saem dos próximos sorteios.
  // Gizmo (Any) é a única exceção e pode repetir.
  for (const prize of prizes) {
    if (prize.name !== 'Gizmo (Any)' && obtained.has(prize.name)) continue;
    cumulative += 1 / prize.odds;
    if (roll < cumulative) {
      won = prize;
      break;
    }
  }

  opened++;
  openedEl.textContent = opened.toLocaleString('pt-BR');

  result.className = 'result' + (won ? '' : ' none');
  result.replaceChildren();

  if (won) {
    if (won.name !== 'Gizmo (Any)') {
      obtained.add(won.name);
      rowByPrize.get(won.name)?.classList.add('obtained');
    }
    const image = document.createElement('img');
    image.src = won.image;
    image.alt = '';
    const wrap = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'result-title';
    title.textContent = '🎉 ' + won.name + '!';
    const detail = document.createElement('div');
    detail.className = 'result-detail';
    detail.textContent = 'You got this prize!';
    wrap.append(title, detail);
    result.append(image, wrap);
    history.unshift('🎉 ' + won.name);
  } else {
    result.textContent = 'Nothing this time... Try again!';
    history.unshift('Nada');
  }

  history = history.slice(0, 8);
  historyEl.replaceChildren();
  const label = document.createElement('strong');
  label.textContent = 'Recent results:';
  historyEl.append(label, document.createElement('br'));
  history.forEach((entry, index) => {
    if (index) historyEl.append(' · ');
    historyEl.append(entry);
  });
}
document.getElementById('openBtn').addEventListener('click', openChest);
</script>
